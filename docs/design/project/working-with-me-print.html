<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Working with Me — Three Directions (PDF)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/base.css?v=3">
<link rel="stylesheet" href="styles/v1.css?v=3">
<link rel="stylesheet" href="styles/v2.css?v=3">
<link rel="stylesheet" href="styles/v3.css?v=3">

<style>
  /* Each variation is a tall page. Use a custom page size that matches
     1440 wide × the rendered height (~4400px). Printers convert px to
     CSS in., so we declare an explicit @page size in inches. */
  @page {
    size: 15in 46in;
    margin: 0;
  }

  html, body { background: #F4EFE6; }

  body {
    margin: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .pdf-page {
    width: 1440px;
    margin: 0 auto;
    background: var(--paper);
    overflow: hidden;
    /* one variation per printed page */
    break-after: page;
    page-break-after: always;
  }
  .pdf-page:last-child {
    break-after: auto;
    page-break-after: auto;
  }

  /* in browser preview, separate the three with a small gap so they
     don't visually merge */
  @media screen {
    body { padding: 24px 0; }
    .pdf-page {
      box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 12px 40px rgba(0,0,0,0.08);
      margin-bottom: 32px;
    }
  }

  /* Avoid awkward splits inside sections, headlines, cards */
  section, .v1-hero, .v2-hero, .v3-hero,
  .v1-screens, .v1-screens-deep, .v1-unlocks,
  .v2-sample, .v2-wall .v2-wcard, .v2-keep,
  .v3-anatomy, .v3-table, .v3-cred,
  .faq-row, .cred-token {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* hide any interactive chrome in print */
  @media print {
    .twk-panel { display: none !important; }
    body { padding: 0; }
    .pdf-page { box-shadow: none; margin-bottom: 0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="brand-mark.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="v1.jsx"></script>
<script type="text/babel" src="v2.jsx"></script>
<script type="text/babel" src="v3.jsx"></script>

<script type="text/babel">
function PrintApp() {
  return (
    <>
      <div className="pdf-page"><V1 /></div>
      <div className="pdf-page"><V2 /></div>
      <div className="pdf-page"><V3 /></div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PrintApp />);

// auto-print after fonts + React commit settle
(async () => {
  if (document.fonts && document.fonts.ready) {
    await document.fonts.ready;
  }
  // give React a frame to commit, then a generous tail for layout/images
  await new Promise((r) => requestAnimationFrame(() => r()));
  await new Promise((r) => setTimeout(r, 800));
  window.print();
})();
</script>
</body>
</html>
